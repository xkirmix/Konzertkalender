# Konzertkalender – Einstellungen auf dem Kindle

# Kalenderbild für den Schlafbildschirm (GitHub Pages)
IMAGE_URL="https://xkirmix.github.io/Konzertkalender/kalender.png"

# Klickbare Version für den Browser
PAGE_URL="https://xkirmix.github.io/Konzertkalender/"

# Alle wie viele Stunden der Kindle kurz aufwacht und nach einer neuen Ausgabe schaut
REFRESH_HOURS=12

# Nach einem fehlgeschlagenen Download: nach wie vielen Minuten er es erneut versucht
RETRY_MINUTES=60

# 1 = beim Aufwecken automatisch die klickbare Seite öffnen, 0 = ganz normaler Kindle
OPEN_PAGE_ON_WAKE=1

# Unter dieser Akku-Prozentzahl erscheint ein Lade-Hinweis auf dem Kalenderbild
LOW_BATTERY_PERCENT=15
