[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konzertkalender"
version = "0.1.0"
description = "Wöchentlicher E-Ink-Konzertkalender (Do–Sa) für Clubs in Bern und Fribourg, gerendert für einen Kindle Paperwhite 4."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
konzertkalender = "konzertkalender.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
konzertkalender = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
