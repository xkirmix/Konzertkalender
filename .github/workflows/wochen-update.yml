name: Wochen-Update

on:
  schedule:
    - cron: "15 4 * * 1"  # jeden Montag 04:15 UTC = 05:15 (Winter) bzw. 06:15 (Sommer) Schweizer Zeit
  workflow_dispatch: {}  # von Hand starten: Actions → Wochen-Update → Run workflow

permissions:
  contents: write

concurrency:
  group: wochen-update
  cancel-in-progress: false

jobs:
  kalender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Kalender erstellen
        run: python -m konzertkalender --ausgabe docs

      - name: Neue Ausgabe veröffentlichen
        # Der wöchentliche Commit hält auch den Zeitplan aktiv (GitHub pausiert Zeitpläne
        # in Repositories ohne Aktivität nach 60 Tagen).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Kalender-Update $(date +%Y-%m-%d)" || echo "Keine Änderungen"
          git push
